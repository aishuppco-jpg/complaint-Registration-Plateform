<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login | UP Police Medical Portal</title>
    
    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Employee Secure Login">
    <meta property="og:site_name" content="UP Police Medical Portal">
    <meta property="og:description" content="Secure OTP authentication for UP Police Technical Services employees.">
    <meta property="og:image" content="new_up_police_logo.png">
    
    <link rel="icon" type="image/png" href="new_up_police_logo.png">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-glow: rgba(30, 58, 138, 0.15);
            --accent: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.25);
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(148, 163, 184, 0.2);
            --error: #f43f5e;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0f172a 0%, #1e1b4b 90%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient glowing circles */
        .ambient-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(var(--accent-glow) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }

        .glow-1 { top: -100px; left: -100px; }
        .glow-2 { bottom: -100px; right: -100px; }

        .login-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            z-index: 10;
            position: relative;
            transform: translateY(20px);
            opacity: 0;
            animation: cardEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEnter {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-area img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(37, 99, 235, 0.3));
            margin-bottom: 15px;
            transition: transform 0.5s ease;
        }

        .logo-area img:hover {
            transform: rotate(360deg);
        }

        .logo-area h2 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-area p {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 24px;
            position: relative;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            transition: color 0.3s;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            transition: color 0.3s;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-light);
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .input-wrapper input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
            background: rgba(15, 23, 42, 0.8);
        }

        .input-wrapper input:focus + i {
            color: var(--accent);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            background: #334155;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* OTP Input Sub-state styling */
        .otp-section {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .timer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-top: 12px;
            color: var(--text-muted);
        }

        #timer {
            color: var(--accent);
            font-weight: 600;
        }

        .resend-link {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            padding: 0;
            transition: opacity 0.3s;
        }

        .resend-link:disabled {
            color: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 13px;
            text-decoration: none;
            margin-top: 20px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: var(--text-light);
        }

        /* Card shaking animation for errors */
        .shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .alert-box {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        .alert-error {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #fda4af;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #a7f3d0;
        }

        /* Portal Navigation Footer */
        .portal-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid rgba(148, 163, 184, 0.1);
            padding-top: 20px;
        }

        .portal-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .portal-footer a:hover {
            color: var(--text-light);
            text-decoration: underline;
        }

        /* Spinner */
        .spinner {
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <div class="login-card" id="loginCard">
        <div class="logo-area">
            <img src="new_up_police_logo.png" alt="UP Police Logo">
            <h2>Medical Claims Portal</h2>
            <p>Employee Authentication</p>
        </div>

        <div id="alertBox" class="alert-box">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="alertMessage"></span>
        </div>

        <!-- STATE 1: EMAIL & PNO FORM -->
        <form id="requestForm" onsubmit="handleRequestOTP(event)">
            <div class="input-group">
                <label class="input-label" for="employeeEmail">Registered Email ID</label>
                <div class="input-wrapper">
                    <input type="email" id="employeeEmail" placeholder="name@example.com" required autocomplete="email">
                    <i class="fa-solid fa-envelope"></i>
                </div>
            </div>

            <div class="input-group">
                <label class="input-label" for="employeePno">Personal Number (PNO)</label>
                <div class="input-wrapper">
                    <input type="text" id="employeePno" placeholder="Enter your PNO" required autocomplete="username">
                    <i class="fa-solid fa-id-card"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btnRequest">
                <span>Send OTP</span>
                <i class="fa-solid fa-paper-plane"></i>
                <i class="fa-solid fa-spinner spinner" id="requestSpinner"></i>
            </button>
        </form>

        <!-- STATE 2: OTP VERIFICATION FORM -->
        <div class="otp-section" id="otpSection">
            <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 20px; text-align: center;">
                An OTP has been sent to <b id="displayEmail" style="color: var(--text-light);"></b>.<br>Please check your inbox.
            </p>

            <form id="verifyForm" onsubmit="handleVerifyOTP(event)">
                <div class="input-group">
                    <label class="input-label" for="otpInput">Enter 6-Digit OTP</label>
                    <div class="input-wrapper">
                        <input type="text" id="otpInput" placeholder="______" required maxlength="6" pattern="\d{6}" style="text-align: center; letter-spacing: 6px; font-size: 20px; font-weight: 700; padding-left: 16px;">
                        <i class="fa-solid fa-key" style="display: none;"></i>
                    </div>
                    <div class="timer-info">
                        <span>OTP Expires in: <span id="timer">05:00</span></span>
                        <button type="button" class="resend-link" id="btnResend" onclick="resendOTP()" disabled>Resend OTP</button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnVerify">
                    <span>Verify & Login</span>
                    <i class="fa-solid fa-shield-check"></i>
                    <i class="fa-solid fa-spinner spinner" id="verifySpinner"></i>
                </button>
            </form>

            <div class="back-link" onclick="goBackToRequest()">
                <i class="fa-solid fa-arrow-left"></i> Back to Email & PNO
            </div>
        </div>

        <div class="portal-footer">
            Are you an Administrator? <a href="new_page_medical.html">Admin Portal</a>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        let countdownInterval = null;
        let countdownSeconds = 300; // 5 minutes
        let localDebugOtp = null; // Stored only in mock mode for display

        // Check if user is already logged in, if so redirect to dashboard
        if (localStorage.getItem('emp_session_token')) {
            window.location.href = 'employee_dashboard.html';
        }

        function showAlert(msg, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            const alertMessage = document.getElementById('alertMessage');
            
            alertBox.className = `alert-box alert-${type}`;
            alertBox.style.display = 'flex';
            alertMessage.textContent = msg;

            const icon = alertBox.querySelector('i');
            if (type === 'error') {
                icon.className = 'fa-solid fa-circle-exclamation';
                triggerShake();
            } else {
                icon.className = 'fa-solid fa-circle-check';
            }
        }

        function hideAlert() {
            document.getElementById('alertBox').style.display = 'none';
        }

        function triggerShake() {
            const card = document.getElementById('loginCard');
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 400);
        }

        async function handleRequestOTP(e) {
            e.preventDefault();
            hideAlert();

            const email = document.getElementById('employeeEmail').value.trim();
            const pno = document.getElementById('employeePno').value.trim();
            
            const btn = document.getElementById('btnRequest');
            const spinner = document.getElementById('requestSpinner');
            
            btn.disabled = true;
            spinner.style.display = 'inline-block';

            try {
                const response = await fetch(`${API_URL}/api/auth/request-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, pno })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to send OTP. Please check your credentials.');
                }

                // If local test mode (returned debugOtp)
                if (data.debugOtp) {
                    localDebugOtp = data.debugOtp;
                    showAlert(`[DEV MOCK MODE] OTP generated: ${data.debugOtp}. Entering it automatically for your convenience.`, 'success');
                    document.getElementById('otpInput').value = data.debugOtp;
                } else {
                    showAlert('OTP has been sent to your email address.', 'success');
                }

                // Show OTP section, hide Request Form
                document.getElementById('displayEmail').textContent = email;
                document.getElementById('requestForm').style.display = 'none';
                document.getElementById('otpSection').style.display = 'block';

                startTimer();

            } catch (err) {
                showAlert(err.message, 'error');
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
            }
        }

        async function handleVerifyOTP(e) {
            e.preventDefault();
            hideAlert();

            const email = document.getElementById('employeeEmail').value.trim();
            const pno = document.getElementById('employeePno').value.trim();
            const otp = document.getElementById('otpInput').value.trim();

            const btn = document.getElementById('btnVerify');
            const spinner = document.getElementById('verifySpinner');

            btn.disabled = true;
            spinner.style.display = 'inline-block';

            try {
                const response = await fetch(`${API_URL}/api/auth/verify-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, pno, otp })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Incorrect OTP. Please check and try again.');
                }

                // Save session token and info
                localStorage.setItem('emp_session_token', data.token);
                localStorage.setItem('emp_profile', JSON.stringify(data.employee));

                // Success redirect
                showAlert('Login successful! Redirecting to your dashboard...', 'success');
                clearInterval(countdownInterval);

                setTimeout(() => {
                    window.location.href = 'employee_dashboard.html';
                }, 1500);

            } catch (err) {
                showAlert(err.message, 'error');
                btn.disabled = false;
                spinner.style.display = 'none';
            }
        }

        function goBackToRequest() {
            clearInterval(countdownInterval);
            hideAlert();
            document.getElementById('otpSection').style.display = 'none';
            document.getElementById('requestForm').style.display = 'block';
            document.getElementById('otpInput').value = '';
            localDebugOtp = null;
        }

        function startTimer() {
            clearInterval(countdownInterval);
            countdownSeconds = 300;
            document.getElementById('btnResend').disabled = true;
            
            const timerSpan = document.getElementById('timer');
            
            countdownInterval = setInterval(() => {
                countdownSeconds--;
                
                const mins = String(Math.floor(countdownSeconds / 60)).padStart(2, '0');
                const secs = String(countdownSeconds % 60).padStart(2, '0');
                timerSpan.textContent = `${mins}:${secs}`;

                if (countdownSeconds <= 0) {
                    clearInterval(countdownInterval);
                    timerSpan.textContent = '00:00';
                    document.getElementById('btnResend').disabled = false;
                    showAlert('OTP has expired. Please click "Resend OTP" to request a new code.', 'error');
                }
            }, 1000);
        }

        function resendOTP() {
            goBackToRequest();
            // Trigger automatic click of request to resend
            document.getElementById('btnRequest').click();
        }
    </script>
</body>
</html>
