<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Complaint</title>
    <meta name="description" content="Register a new complaint by entering your details.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Register Complaint</h1>
        <form id="complaintForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" required placeholder="New York">
            </div>
            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" required placeholder="1234567890">
            </div>
            <div class="form-group">
                <label for="complaint">Complaint Details</label>
                <textarea id="complaint" required placeholder="Describe your issue here..."></textarea>
            </div>
            <div id="aiSection" style="display: none; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
                <div class="form-group ai-question-box" style="background-color: rgba(59, 130, 246, 0.1); padding: 1rem; border-radius: 8px; border-left: 4px solid var(--primary); margin-bottom: 1rem;">
                    <strong>AI Question:</strong>
                    <p id="aiQuestionText" style="margin-top: 0.5rem;"></p>
                </div>
                <div class="form-group">
                    <label for="aiAnswer">Your Answer</label>
                    <textarea id="aiAnswer" placeholder="Provide more details based on the question above..."></textarea>
                </div>
            </div>
            <button type="submit" class="btn" id="submitBtn">Generate AI Question</button>
            <a href="index.html" style="display:block; text-align:center; margin-top:1rem; color:var(--text-secondary); text-decoration:none;">Cancel</a>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
